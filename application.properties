spring.application.name=verification-summary-batch-demo

# In-memory H2 database for the Spring Batch job repository (metadata only).
spring.datasource.url=jdbc:h2:mem:batchdemo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run the job automatically on startup for this demo.
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always

logging.level.org.springframework.batch=INFO
